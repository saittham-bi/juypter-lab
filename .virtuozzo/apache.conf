# =============================================================================
# .virtuozzo/apache.conf
# Apache Reverse-Proxy für JupyterLab auf Virtuozzo Python-Node
#
# Ablegen unter: /etc/apache2/conf.d/jupyterlab.conf
# Danach:        service httpd restart  ODER  service apache2 restart
# =============================================================================

# Benötigte Module (auf Virtuozzo meist bereits aktiv)
LoadModule proxy_module        modules/mod_proxy.so
LoadModule proxy_http_module   modules/mod_proxy_http.so
LoadModule proxy_wstunnel_module modules/mod_proxy_wstunnel.so
LoadModule rewrite_module      modules/mod_rewrite.so

<VirtualHost *:80>

    # Grosse Uploads erlauben (Notebooks, Datei-Uploads)
    LimitRequestBody 104857600

    # ── WebSocket-Proxy (ZWINGEND für Jupyter Kernel) ──────────────────────
    RewriteEngine On

    # WebSocket-Verbindungen (Kernel-Kommunikation, Live-Updates)
    RewriteCond %{HTTP:Upgrade} websocket [NC]
    RewriteCond %{HTTP:Connection} upgrade  [NC]
    RewriteRule ^/?(.*) ws://127.0.0.1:8888/$1 [P,L]

    # ── HTTP-Proxy ─────────────────────────────────────────────────────────
    ProxyRequests     Off
    ProxyPreserveHost On

    ProxyPass        / http://127.0.0.1:8888/
    ProxyPassReverse / http://127.0.0.1:8888/

    # Original-IP weiterleiten
    ProxyPassReverseCookieDomain 127.0.0.1 %{HTTP_HOST}
    RequestHeader set X-Forwarded-Proto "https"

    # Timeout für lang laufende Notebook-Operationen
    ProxyTimeout 300

</VirtualHost>
